<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>HOME-DÁLIA</title>
    <link rel="stylesheet" href="style.css">

    <!-- ---------------------fontes-------------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Judson:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <div class="header_container">

            <div class="img">
                <img src="./imagens/logo_dalia.png" alt="logo dalia" class="logo">
            </div>


            <div class="box_busca">
                <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--!Font Awesome Free 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
                </svg>
                <input type="text" placeholder="Buscar joias">
            </div>



            <nav class="header_txt2">
                <button><img src="./icones/perfil.png" alt="usuario"></button>
                <button><img src="./icones/sacola.png" alt="sacola"></button>
            </nav>

        </div>
    </header>


    <main>

        <section class="banner">

            <img src="./imagens/banner.svg" alt="banner">


            <div class="texto_banner">

                <h1>Detalhes que fazem <br> você <span class="destaque"> brilhar. </span></h1>



                <p>Joias que realçam sua beleza e <br> tornam cada momento ainda mais especial. Brilhe com
                    elegância e personalidade.</p>

                <button>Coleção exclusiva</button>
            </div>
        </section>

        <section class="novidades">

            <div class="container_txtnovidades">
                <h2>Novidades</h2>
                <hr>
            </div>

            <!-- ------------------produtos----------------------- -->


            <div class="container_produtos">


                <div class="produtos">
                    <button><img src="./imagens/bracelete.jpg" alt="bracelete"></button>
                    <span>Braceletes</span>
                </div>


                <div class="produtos">
                    <button><img src="./imagens/brinco.jpg" alt="brinco"></button>
                    <span>Brincos</span>
                </div>



                <div class="produtos">
                    <button> <img src="./imagens/colar3.png" alt="colar"></button>
                    <span>Colares</span>
                </div>


            </div>

        </section>

    </main>


    <!-- ------------------------footer------------------ -->



    <footer>

        <div class="footer_container">


            <nav class="footer_nav">
                <a href="">Quem somos</a>
                <a href="">Contato</a>
            </nav>

            
                <img src="./imagens/logo_dalia.png" alt="logo" class="logo">
            

            <nav class="footer_nav">
                <a href="">Instagram</a>
                <a href="">Facebook</a>

            </nav>


        </div>





    </footer>




</body>

</html>
